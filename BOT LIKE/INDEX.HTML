<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B25 CHEATS - Professional Like Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #111827; --card-bg: #1F2937; --border: #374151; --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF; --accent: #3B82F6; --accent-hover: #2563EB; --error: #EF4444;
            --success: #22C55E; --discord: #5865F2; --telegram: #26A5E4; --youtube: #FF0000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { width: 100%; max-width: 380px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border); padding: 32px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
        .uid-input { width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background-color: #111827; color: var(--text-primary); }
        .uid-input::placeholder { color: var(--text-secondary); }
        .uid-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .submit-btn { background: var(--accent); color: white; padding: 12px; width: 100%; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; height: 48px; }
        .submit-btn:hover:not(:disabled) { background-color: var(--accent-hover); }
        .submit-btn:disabled { background-color: var(--border); cursor: not-allowed; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid var(--text-primary); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert { margin-top: 16px; padding: 12px; border-radius: 8px; background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); font-size: 14px; text-align: left; }
        .divider { height: 1px; background-color: var(--border); margin: 24px 0; }
        .social-links { display: flex; flex-direction: column; gap: 12px; }
        .social-btn { text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: opacity 0.2s; text-align: center;}
        .discord-btn { background-color: var(--discord); color: white; }
        .telegram-btn { background-color: var(--telegram); color: white; }
        .youtube-btn { background-color: var(--youtube); color: white; }
        .social-btn:hover { opacity: 0.9; }

        /* YEH HISSA POPUP (MODAL) KE LIYE HAI */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .modal-content { position: relative; background-color: var(--card-bg); margin: 15% auto; padding: 25px; border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 500px; animation-name: animatetop; animation-duration: 0.4s; }
        @keyframes animatetop { from {top: -300px; opacity: 0} to {top: 0; opacity: 1} }
        .modal-header { padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .modal-header h2 { color: var(--success); font-size: 20px; }
        .close-btn { color: var(--text-secondary); float: right; font-size: 28px; font-weight: bold; line-height: 1; }
        .close-btn:hover, .close-btn:focus { color: var(--text-primary); text-decoration: none; cursor: pointer; }
        .modal-body { padding-top: 20px; font-family: 'Courier New', monospace; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; text-align: left; color: #d0d0d0;}
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">B25 Like Service</h1>
        <p class="subtitle">Enter your Game UID for a boost!</p>
        <form id="likeForm" method="post" onsubmit="handleFormSubmit()">
            <input type="number" name="uid" placeholder="Enter your Game UID" class="uid-input" required>
            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">Get Likes</span>
                <div class="spinner"></div>
            </button>
        </form>


            <div class="alert">Please enter a valid numeric UID.</div>


        <div class="divider"></div>

        <div class="social-links">
            <a href="https://discord.gg/7PG6MF9wCN" target="_blank" class="social-btn discord-btn">Join Discord</a>
            <a href="https://t.me/b25cheats" target="_blank" class="social-btn telegram-btn">Join Telegram</a>
            <a href="https://www.youtube.com/@b25-cheats" target="_blank" class="social-btn youtube-btn">Subscribe on YouTube</a>
        </div>
    </div>

    <!-- POPUP KA HTML CODE YAHAN HAI -->
    <div id="successModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="close-btn">&times;</span>
          <h2>Success! Result Below</h2>
        </div>
        <div class="modal-body">
          <pre id="modal-data"></pre>
        </div>
      </div>
    </div>

    <script>
        function handleFormSubmit() {
            document.getElementById('submitBtn').disabled = true;
            document.querySelector('.btn-text').style.display = 'none';
            document.querySelector('.spinner').style.display = 'block';
        }

        // YEH SCRIPT POPUP KO DIKHAYEGA JAB SUCCESS HOGA

    </script>
</body>
</html>
